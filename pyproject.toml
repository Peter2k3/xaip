[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xaip"
version = "0.1.0"
description = "AI-Driven API Tester — agent-native CLI/TUI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "textual>=0.60",
    "httpx[http2]>=0.27",
    "authlib>=1.3",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "deepdiff>=7",
    "jsonpath-ng>=1.6",
    "tree-sitter>=0.22",
    "javalang>=0.13",
    "python-dotenv>=1.0",
    "anyio>=4",
]

[project.scripts]
xaip = "xaip.main:app"

[tool.hatch.build.targets.wheel]
packages = ["xaip"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
